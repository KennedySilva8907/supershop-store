services:
  db:
    image: postgres:17-alpine
    container_name: supershop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: supershop
      POSTGRES_USER: supershop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supershop_dev}
    ports:
      - "5432:5432"
    volumes:
      - supershop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supershop -d supershop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supershop-data:
