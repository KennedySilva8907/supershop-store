name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/SuperShop.slnx

      - name: Build
        run: dotnet build backend/SuperShop.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test backend/SuperShop.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory artifacts/tests

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: artifacts/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
